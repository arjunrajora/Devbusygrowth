<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="reBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1a"/>
      <stop offset="100%" stop-color="#071a3d"/>
    </linearGradient>
    <linearGradient id="reAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a651"/>
      <stop offset="100%" stop-color="#0d60c4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#reBg)"/>
  <!-- Real Estate Skyline & Location Pin -->
  <g transform="translate(240, 100)">
    <rect x="60" y="160" width="90" height="180" rx="8" fill="none" stroke="#0d60c4" stroke-width="8"/>
    <rect x="170" y="80" width="110" height="260" rx="8" fill="none" stroke="url(#reAccent)" stroke-width="10"/>
    <!-- Windows -->
    <rect x="195" y="110" width="20" height="20" rx="4" fill="#00a651"/>
    <rect x="235" y="110" width="20" height="20" rx="4" fill="#00a651"/>
    <rect x="195" y="150" width="20" height="20" rx="4" fill="#00a651"/>
    <rect x="235" y="150" width="20" height="20" rx="4" fill="#00a651"/>
    <rect x="195" y="190" width="20" height="20" rx="4" fill="#00a651"/>
    <rect x="235" y="190" width="20" height="20" rx="4" fill="#00a651"/>
  </g>
  <text x="400" y="480" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="bold">Real Estate Marketing</text>
  <text x="400" y="520" text-anchor="middle" fill="#00a651" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">High-Intent Site Visit Leads</text>
</svg>
