<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1a"/>
      <stop offset="50%" stop-color="#071a3d"/>
      <stop offset="100%" stop-color="#0b2857"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d60c4"/>
      <stop offset="100%" stop-color="#00a651"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bg2)"/>
  
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <circle cx="200" cy="300" r="150" fill="#0d60c4" opacity="0.15" filter="blur(40px)"/>
  <circle cx="650" cy="180" r="120" fill="#00a651" opacity="0.12" filter="blur(40px)"/>

  <rect x="40" y="40" width="170" height="32" rx="16" fill="#0d60c4" fill-opacity="0.15" stroke="#0d60c4" stroke-opacity="0.4"/>
  <text x="55" y="61" fill="#0d60c4" font-family="system-ui, sans-serif" font-weight="800" font-size="12" letter-spacing="1">STEP 02 • STRATEGIZE</text>
  
  <text x="40" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24">Growth Strategy &amp; Funnel Roadmap</text>

  <!-- Funnel Node Flow Diagram -->
  <g transform="translate(40, 140)">

    <!-- Node 1: Traffic Channels -->
    <rect x="0" y="20" width="210" height="90" rx="16" fill="#071a3d" stroke="#0d60c4" stroke-width="1.5"/>
    <text x="20" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="11">TRAFFIC ALLOCATION</text>
    <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Meta &amp; Google Ads</text>
    <text x="20" y="93" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">High-ROAS Hook Matrix</text>

    <!-- Connector 1 -->
    <path d="M 210 65 L 265 65" stroke="url(#accent2)" stroke-width="3" stroke-dasharray="4 2"/>
    <polygon points="265,60 275,65 265,70" fill="#00a651"/>

    <!-- Node 2: Offer Hook Wireframe -->
    <rect x="275" y="20" width="210" height="90" rx="16" fill="#071a3d" stroke="#00a651" stroke-width="1.5"/>
    <text x="295" y="50" fill="#00a651" font-family="system-ui, sans-serif" font-weight="800" font-size="11">OFFER HOOK WIREFRAME</text>
    <text x="295" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Direct Response UI</text>
    <text x="295" y="93" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Sub-3 Second Hook Rate</text>

    <!-- Connector 2 -->
    <path d="M 485 65 L 540 65" stroke="url(#accent2)" stroke-width="3" stroke-dasharray="4 2"/>
    <polygon points="540,60 550,65 540,70" fill="#00a651"/>

    <!-- Node 3: Instant Routing -->
    <rect x="550" y="20" width="170" height="90" rx="16" fill="#071a3d" stroke="#0d60c4" stroke-width="1.5"/>
    <text x="568" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="11">AUTO ROUTING</text>
    <text x="568" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">WhatsApp API</text>
    <text x="568" y="93" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Instant Qualification</text>

    <!-- Channel Split Cards Below -->
    <rect x="0" y="140" width="350" height="150" rx="16" fill="#071a3d" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Channel Budget Strategy Map</text>
    
    <rect x="20" y="190" width="310" height="32" rx="8" fill="#050c1a"/>
    <text x="35" y="211" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Meta Creative Testing (60%)</text>
    <text x="270" y="211" fill="#00a651" font-family="system-ui, sans-serif" font-weight="800" font-size="12">Scale</text>

    <rect x="20" y="232" width="310" height="32" rx="8" fill="#050c1a"/>
    <text x="35" y="253" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Google Intent Search (40%)</text>
    <text x="270" y="253" fill="#0d60c4" font-family="system-ui, sans-serif" font-weight="800" font-size="12">Capture</text>

    <!-- Conversion Forecast -->
    <rect x="370" y="140" width="350" height="150" rx="16" fill="#071a3d" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="390" y="170" fill="#00a651" font-family="system-ui, sans-serif" font-weight="800" font-size="14">Projected Conversion Funnel</text>
    
    <text x="390" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Estimated Impression Pool</text>
    <text x="640" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="14">500,000+</text>

    <text x="390" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Target Verified Leads</text>
    <text x="640" y="235" fill="#00a651" font-family="system-ui, sans-serif" font-weight="800" font-size="14">1,400+</text>

    <rect x="390" y="255" width="310" height="20" rx="10" fill="#050c1a"/>
    <rect x="390" y="255" width="240" height="20" rx="10" fill="url(#accent2)"/>
  </g>
</svg>
