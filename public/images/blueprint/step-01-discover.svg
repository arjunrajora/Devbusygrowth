<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1a"/>
      <stop offset="50%" stop-color="#071a3d"/>
      <stop offset="100%" stop-color="#0b1c3d"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a651"/>
      <stop offset="100%" stop-color="#0d60c4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bg1)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Glowing Glow Circles -->
  <circle cx="250" cy="220" r="140" fill="#00a651" opacity="0.12" filter="blur(40px)"/>
  <circle cx="580" cy="280" r="120" fill="#0d60c4" opacity="0.12" filter="blur(40px)"/>

  <!-- Step Badge & Header -->
  <rect x="40" y="40" width="160" height="32" rx="16" fill="#00a651" fill-opacity="0.15" stroke="#00a651" stroke-opacity="0.4"/>
  <text x="55" y="61" fill="#00a651" font-family="system-ui, sans-serif" font-weight="800" font-size="12" letter-spacing="1">STEP 01 • DISCOVER</text>
  
  <text x="40" y="110" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24">Market &amp; Audience Audit</text>

  <!-- Card 1: Target ICP Persona -->
  <rect x="40" y="140" width="340" height="310" rx="16" fill="#071a3d" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <text x="60" y="175" fill="#00a651" font-family="system-ui, sans-serif" font-weight="800" font-size="13">TARGET CUSTOMER PERSONA</text>
  
  <!-- Persona Nodes -->
  <rect x="60" y="195" width="300" height="60" rx="12" fill="#050c1a" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="90" cy="225" r="16" fill="#00a651" fill-opacity="0.2"/>
  <path d="M90 217 a8 8 0 1 0 0 16 a8 8 0 0 0 0 -16 Z" fill="#00a651"/>
  <text x="120" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">High-Intent Buyer Segment</text>
  <text x="120" y="238" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="11">Age 25-45 • E-Commerce Buyers</text>

  <!-- Pain Points Box -->
  <rect x="60" y="270" width="300" height="70" rx="12" fill="#050c1a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="75" y="293" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Core Bottleneck Identified</text>
  <text x="75" y="313" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="500" font-size="11">High ad CAC due to weak creative offer hooks</text>

  <!-- Unit Economics Pill -->
  <rect x="60" y="355" width="300" height="70" rx="12" fill="#00a651" fill-opacity="0.1" stroke="#00a651" stroke-opacity="0.3"/>
  <text x="75" y="380" fill="#00a651" font-family="system-ui, sans-serif" font-weight="800" font-size="12">UNIT ECONOMICS BENCHMARK</text>
  <text x="75" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Target ROAS: 3.5x+ | LTV: ₹4,500</text>

  <!-- Card 2: Competitor Audit Graph -->
  <rect x="410" y="140" width="350" height="310" rx="16" fill="#071a3d" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <text x="430" y="175" fill="#0d60c4" font-family="system-ui, sans-serif" font-weight="800" font-size="13">COMPETITOR MARKET SHARE AUDIT</text>

  <!-- Bar Chart Graphics -->
  <g transform="translate(430, 200)">
    <text x="0" y="180" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Competitor A</text>
    <rect x="90" y="168" width="120" height="14" rx="7" fill="#1e293b"/>
    <rect x="90" y="168" width="60" height="14" rx="7" fill="#64748b"/>

    <text x="0" y="130" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Competitor B</text>
    <rect x="90" y="118" width="180" height="14" rx="7" fill="#1e293b"/>
    <rect x="90" y="118" width="110" height="14" rx="7" fill="#0d60c4"/>

    <text x="0" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="10">Our Blueprint Target</text>
    <rect x="90" y="68" width="220" height="16" rx="8" fill="#1e293b"/>
    <rect x="90" y="68" width="195" height="16" rx="8" fill="url(#accent1)"/>

    <circle cx="285" cy="76" r="6" fill="#00a651"/>
    <text x="230" y="45" fill="#00a651" font-family="system-ui, sans-serif" font-weight="800" font-size="12">Top 5% Market Advantage</text>
  </g>

  <!-- Status pill -->
  <rect x="430" y="380" width="310" height="45" rx="12" fill="#050c1a" stroke="#00a651" stroke-opacity="0.3"/>
  <circle cx="450" cy="402" r="4" fill="#00a651"/>
  <text x="465" y="407" fill="#00a651" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Phase 1 Complete • ICP Audit Verified</text>
</svg>
