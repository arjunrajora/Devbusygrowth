name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/Devbusygrowth

            git fetch origin
            git checkout main
            git pull origin main

            pm2 delete devbusygrowth || true

            npm ci

            npm run build

            pm2 start npm --name devbusygrowth -- start

            pm2 save
